<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSchedule Pro - ระบบบริหารจัดการตารางสอนสถานศึกษา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-indigo-700 p-2.5 rounded-xl shadow-inner text-xl font-bold">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">EduSchedule Pro Enterprise</h1>
                    <p class="text-xs text-indigo-200">ระบบบริหารจัดการตารางสอนและซิงค์ข้อมูล Cloud</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 bg-indigo-800/60 p-2 rounded-xl border border-indigo-600">
                <span id="syncStatus" class="text-xs text-indigo-200 px-2 font-medium">สถานะ:พร้อมใช้งาน</span>
                <button onclick="syncToCloud()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3.5 py-2 rounded-lg font-medium transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-cloud-arrow-up"></i> บันทึกขึ้น Cloud
                </button>
                <button onclick="fetchFromCloud()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3.5 py-2 rounded-lg font-medium transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-cloud-arrow-down"></i> ดึงข้อมูลจาก Cloud
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        <aside class="lg:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-bars-progress text-indigo-600"></i> เมนูจัดการระบบ
                </h2>
                <nav class="space-y-1.5 text-sm">
                    <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-xl bg-indigo-50 text-indigo-700 font-semibold">
                        <i class="fa-solid fa-house text-indigo-600"></i> หน้าหลักภาพรวม
                    </a>
                </nav>
            </div>
        </aside>

        <section class="lg:col-span-3 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-bold text-slate-800 flex items-center gap-2 border-b pb-3">
                    <i class="fa-solid fa-sliders text-indigo-600"></i> แผงควบคุมการซิงค์ข้อมูล Google Sheets
                </h2>
                <p class="text-sm text-slate-600">
                    คลิกปุ่ม <strong>"บันทึกขึ้น Cloud"</strong> ด้านบนเพื่อส่งข้อมูลตารางสอนทั้งหมดตรงไปเก็บไว้ที่ Cell A1 ของ Google Sheet ทันทีครับ
                </p>
            </div>
        </section>
    </main>

    <script>
        // URL ของคุณที่ผ่านการทดสอบแล้วว่าขึ้น status:ok
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6jmWuTHfBct1nM7wn29voX0vzWdTZONXXcmgQVG7NDggiaExaBAI-MYMvyIaQtLVX/exec";

        let appData = {
            schoolConfig: { name: "โรงเรียนวัดคลองตาล(ศรีรัตนประชานุกูล)" },
            teachers: [{ id: 1, name: "คุณครูพัฒน์ปกรณ์" }],
            subjects: [{ id: 1, name: "คณิตศาสตร์" }],
            classes: [{ id: 1, name: "ม.1/1" }],
            updatedAt: new Date().toLocaleString()
        };

        async function syncToCloud() {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "สถานะ: กำลังบันทึก...";
            statusEl.className = "text-xs text-amber-300 px-2 font-medium animate-pulse";

            try {
                // แปลงข้อมูลเป็น JSON และส่งผ่านพารามิเตอร์ data ทาง GET
                const jsonString = encodeURIComponent(JSON.stringify(appData));
                const targetUrl = `${GOOGLE_SCRIPT_URL}?action=saveData&data=${jsonString}`;

                const response = await fetch(targetUrl);
                const result = await response.json();

                if (result.status === "success") {
                    statusEl.innerText = "สถานะ: บันทึกสำเร็จ!";
                    statusEl.className = "text-xs text-emerald-300 px-2 font-medium";
                    alert("✅ บันทึกข้อมูลลง Google Sheet (Cell A1) สำเร็จเรียบร้อยแล้วครับ!");
                } else {
                    throw new Error(result.message || "Unknown error");
                }
            } catch (error) {
                console.error(error);
                statusEl.innerText = "สถานะ: บันทึกไม่สำเร็จ";
                statusEl.className = "text-xs text-rose-300 px-2 font-medium";
                alert("❌ เกิดข้อผิดพลาด: " + error.message);
            }
        }

        async function fetchFromCloud() {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "สถานะ: กำลังดึงข้อมูล...";
            statusEl.className = "text-xs text-sky-300 px-2 font-medium animate-pulse";

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getData`);
                const result = await response.json();

                if (result.status === "success" && result.data) {
                    appData = JSON.parse(result.data);
                    statusEl.innerText = "สถานะ: ดึงข้อมูลสำเร็จ!";
                    statusEl.className = "text-xs text-emerald-300 px-2 font-medium";
                    alert("📥 ดึงข้อมูลจาก Google Sheet สำเร็จเรียบร้อยแล้ว!");
                } else {
                    statusEl.innerText = "สถานะ: ไม่พบข้อมูลในระบบ";
                    statusEl.className = "text-xs text-amber-300 px-2 font-medium";
                }
            } catch (error) {
                console.error(error);
                statusEl.innerText = "สถานะ: ดึงข้อมูลไม่สำเร็จ";
                statusEl.className = "text-xs text-rose-300 px-2 font-medium";
                alert("❌ ไม่สามารถดึงข้อมูลได้: " + error.message);
            }
        }
    </script>
</body>
</html>
